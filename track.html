<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Your request · mea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="/pages/ui.css" />
<style>
  .progress { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .progress li { display: grid; gap: 8px; font-size: 12px; color: var(--faint); }
  .progress li i { height: 6px; border-radius: 3px; background: var(--line); }
  .progress li.done { color: var(--muted); }
  .progress li.done i { background: var(--signal); }
  .progress li.now { color: var(--ink); font-weight: 500; }
  .progress li.now i { background: linear-gradient(90deg, var(--signal) 50%, var(--line) 50%); background-size: 200% 100%; animation: fill 1.6s var(--ease) infinite alternate; }
  @keyframes fill { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .price { font: 600 clamp(56px, 12vw, 88px)/1 var(--display); letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 14px; font-weight: 500; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  dl.brief { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px 16px; margin: 0; font-size: 15px; }
  dl.brief dt { color: var(--muted); }
  dl.brief dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 560px) { dl.brief { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.brief dd { margin-bottom: 10px; } }
  .history { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 14px; }
  .history li { display: flex; gap: 12px; } .history time { flex: none; width: 110px; color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
  .big-state { font: 600 clamp(30px, 6vw, 40px)/1.05 var(--display); letter-spacing: -.05em; margin: 0; text-wrap: balance; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/">mea<span class="px"></span></a><span class="label" id="ref"></span></header>
  <div id="loading" style="padding-top:120px;text-align:center"><span class="px live" style="font-size:40px"></span></div>
  <div id="fail" class="notice bad" style="margin-top:80px" hidden></div>

  <main id="page" hidden>
    <h1 class="title" id="hello"></h1>
    <ol class="progress" id="progress" aria-label="Progress"></ol>
    <div id="state" class="stack" style="margin-top:32px"></div>

    <section class="card stack" style="margin-top:16px">
      <div class="label">Your brief</div>
      <dl class="brief" id="brief"></dl>
    </section>
    <section class="card stack" style="margin-top:16px">
      <div class="label">History</div>
      <ul class="history" id="history"></ul>
    </section>
    <p class="hint" style="margin-top:20px">Questions? Message me on Discord: <span class="mono">qb_f</span>. Keep this page’s link private: anyone with it can see your request.</p>
  </main>
</div>
<script type="module" src="/pages/track.ts"></script>
</body>
</html>
